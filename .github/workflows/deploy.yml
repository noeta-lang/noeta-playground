name: Build and deploy

# Push to main → build the engine (the noeta repo's playground cdylib on
# wasm32-unknown-unknown), build the site, and deploy the static assets to
# Cloudflare Workers.
#
# Two sibling checkouts reproduce the local-disk shape:
#  - noeta-theme/  — the design system ("@noeta/theme": "file:../noeta-theme")
#  - lang/         — the language repo; scripts/sync-engine.mjs (prebuild)
#    builds target/wasm32-unknown-unknown/wasm-release/noeta_playground.wasm
#    from it (rust-cache keeps rebuilds to the changed crates).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout @noeta/theme
        uses: actions/checkout@v6
        with:
          repository: noeta-lang/noeta-theme
          path: noeta-theme

      - name: Checkout the language repo (engine source)
        uses: actions/checkout@v6
        with:
          repository: noeta-lang/noeta
          path: lang

      - name: Set up Rust (wasm32-unknown-unknown)
        run: rustup target add wasm32-unknown-unknown

      - name: Cache the engine build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lang

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build (engine sync + site + OG image)
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
